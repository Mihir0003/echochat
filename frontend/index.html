<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoChat - HQ</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- BoxIcons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="bg-mesh">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay glass active">
        <div class="modal-content glass-card tilt-effect">
            <div class="logo-container">
                <i class='bx bxs-polygon neon-icon'></i>
                <h1>EchoHQ</h1>
            </div>
            <p>Connect to the secure global network</p>
            <form id="login-form">
                <div class="input-group">
                    <i class='bx bxs-user-circle'></i>
                    <input type="text" id="username-input" placeholder="Callsign" required autocomplete="off" maxlength="20">
                </div>
                <button type="submit" class="btn-primary glow-effect">
                    <span>Initialize Sequence</span>
                    <i class='bx bx-rocket'></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Main Professional App Interface -->
    <div id="app-container" class="app-container hidden">
        
        <!-- Channels Sidebar (Left) -->
        <nav class="channels-sidebar glass-panel">
            <div class="brand">
                <i class='bx bxs-polygon neon-icon-small'></i>
            </div>
            <div style="margin-top: 2rem; text-align: center;">
                <p class="section-label" style="margin-top: 0;">Secured Matrix</p>
                <h4 id="session-id-display" style="color: var(--clr-primary); font-family: monospace; font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 1.5rem; background: rgba(0,0,0,0.3); padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">...</h4>
                <button id="btn-copy-link" class="btn-primary glow-effect" style="font-size: 0.95rem; padding: 0.75rem;">
                    <i class='bx bx-copy'></i> Copy Invite Link
                </button>
                <div id="copy-toast" style="color: var(--clr-accent); font-size: 0.85rem; margin-top: 12px; font-weight: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none;">Link copied to clipboard!</div>
            </div>
        </nav>

        <!-- Main Chat Area (Center) -->
        <main class="chat-area glass-panel">
            <header class="chat-header border-bottom">
                <div class="room-info">
                    <h2 id="current-room-title"><i class='bx bx-hash'></i> general</h2>
                    <p>End-to-end encrypted WebSocket matrix</p>
                </div>
                <div class="connection-status-pill" id="connection-status">
                    <div class="status-dot"></div> Connecting...
                </div>
            </header>

            <div id="messages-container" class="messages-container">
                <!-- Messages go here -->
            </div>

            <div class="typing-indicator hidden" id="typing-indicator">
                <span id="typing-users-text">Someone</span> is typing
                <div class="dots"><span>.</span><span>.</span><span>.</span></div>
            </div>

            <div class="chat-input-area border-top">
                <form id="chat-form" class="chat-form">
                    <input type="text" id="message-input" placeholder="Message #general... (Try /whisper User Message)" autocomplete="off" required>
                    <button type="submit" class="btn-send glow-effect">
                        <i class='bx bx-send'></i>
                    </button>
                </form>
            </div>
        </main>

        <!-- Users Sidebar (Right) -->
        <aside class="users-sidebar glass-panel">
            <div class="sidebar-header border-bottom">
                <h3><i class='bx bx-radar'></i> Network</h3>
            </div>
            
            <div class="users-section">
                <!-- Me Section -->
                <div class="user-profile mb-4">
                    <div class="avatar" id="my-avatar"><i class='bx bxs-user'></i></div>
                    <div class="user-info">
                        <span id="my-username-display" class="font-bold">You</span>
                        <span class="status-text">Online</span>
                    </div>
                </div>
                
                <h4 class="section-label">Active Users — <span id="user-count">0</span></h4>
                <ul id="users-list" class="users-list">
                    <!-- Dynamic users -->
                </ul>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
